<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parcel Management</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

.container{
max-width:1300px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin:8px 0 15px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

th,
td{
padding:12px;
border:1px solid #ddd;
text-align:left;
}

.status{
padding:6px 10px;
border-radius:20px;
color:#fff;
font-size:13px;
}

.waiting{
background:#ff9800;
}

.collected{
background:#4caf50;
}

</style>

</head>

<body>

<header>

<div class="container">

<div class="logo">

<h2>📦 Parcel Management</h2>

<p>AKR House Apartments</p>

</div>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="visitors.html">Visitors</a>
<a href="parcels.html">Parcels</a>
<a href="residents.html">Residents</a>
<a href="emergency.html">Emergency</a>
<a href="chat.html">Chat</a>

</nav>

</div>

</header>

<section class="hero">

<div class="container">

<h1>Parcel Management</h1>

<p>Register incoming parcels and notify residents.</p>

</div>

</section>

<div class="container">

<div class="card">

<h2>📦 Register Parcel</h2>

<label>Courier Company</label>

<input
type="text"
id="courierCompany"
placeholder="Example: Amazon">

<label>Tracking Number</label>

<input
type="text"
id="trackingNumber"
placeholder="Tracking Number">

<label>Resident Name</label>

<input
type="text"
id="residentName"
placeholder="Resident Name">

<label>Flat Number</label>

<input
type="text"
id="flat"
placeholder="Example: 203">

<label>Parcel Type</label>

<select id="parcelType">

<option>Package</option>
<option>Document</option>
<option>Food</option>
<option>Other</option>

</select>

<label>Remarks</label>

<textarea
id="remarks"
rows="3"
placeholder="Optional remarks"></textarea>

<button
class="btn primary"
id="saveParcel">

📦 Register Parcel

</button>

</div>

<div class="card">

<h2>📋 Parcel Records</h2>

<input
type="text"
id="searchParcel"
placeholder="Search by resident, flat, courier or tracking number">

<table>

<thead>

<tr>

<th>Courier</th>
<th>Tracking</th>
<th>Resident</th>
<th>Flat</th>
<th>Received</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="parcelTable">

<tr>

<td colspan="7">Loading...</td>

</tr>

</tbody>

</table>

</div>

</div>

<script type="module">

import { db } from "../firebase/firebase-config.js";

import {
collection,
addDoc,
getDocs,
updateDoc,
doc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const table=document.getElementById("parcelTable");

let parcels=[];


/* ==========================================
   Load Parcels
========================================== */

async function loadParcels(){

try{

const snapshot=await getDocs(
collection(db,"parcels")
);

parcels=[];

snapshot.forEach(docSnap=>{

parcels.push({

id:docSnap.id,
...docSnap.data()

});

});

displayParcels(parcels);

}catch(error){

console.error(error);

table.innerHTML=`

<tr>

<td colspan="7">

Unable to load parcels.

</td>

</tr>

`;

}

}


/* ==========================================
   Display Parcels
========================================== */

function displayParcels(list){

table.innerHTML="";

if(list.length===0){

table.innerHTML=`

<tr>

<td colspan="7">

No parcel records found.

</td>

</tr>

`;

return;

}

list.forEach(parcel=>{

const statusClass=

parcel.status==="Collected"
? "collected"
: "waiting";

const row=document.createElement("tr");

row.innerHTML=`

<td>${parcel.courierCompany || "-"}</td>

<td>${parcel.trackingNumber || "-"}</td>

<td>${parcel.residentName || "-"}</td>

<td>${parcel.flat || "-"}</td>

<td>${parcel.receivedDate || "-"}</td>

<td>

<span class="status ${statusClass}">

${parcel.status || "Waiting for Collection"}

</span>

</td>

<td>

${
parcel.status==="Collected"

?

"Completed"

:

`<button
class="btn primary collect-btn">

Mark Collected

</button>`

}

</td>

`;

if(parcel.status!=="Collected"){

row.querySelector(".collect-btn")
.addEventListener("click",()=>{

markCollected(parcel.id);

});

}

table.appendChild(row);

});

}


/* ==========================================
   Register Parcel
========================================== */

document.getElementById("saveParcel")
.addEventListener("click",async()=>{

const courierCompany=
document.getElementById("courierCompany")
.value.trim();

const trackingNumber=
document.getElementById("trackingNumber")
.value.trim();

const residentName=
document.getElementById("residentName")
.value.trim();

const flat=
document.getElementById("flat")
.value.trim();

const parcelType=
document.getElementById("parcelType")
.value;

const remarks=
document.getElementById("remarks")
.value.trim();


if(
courierCompany==="" ||
residentName==="" ||
flat===""
){

alert(
"Please enter Courier, Resident and Flat."
);

return;

}


try{

await addDoc(
collection(db,"parcels"),
{

parcelId:"PK"+Date.now(),

trackingNumber,

courierCompany,

residentUid:"",

residentName,

flat,

parcelType,

receivedDate:
new Date().toLocaleDateString(),

receivedBy:"Security",

status:"Waiting for Collection",

collectedDate:"",

remarks,

createdAt:serverTimestamp()

}
);

alert(
"Parcel registered successfully."
);

document.getElementById("courierCompany").value="";
document.getElementById("trackingNumber").value="";
document.getElementById("residentName").value="";
document.getElementById("flat").value="";
document.getElementById("remarks").value="";

loadParcels();

}catch(error){

console.error(error);

alert(
"Unable to register parcel: "
+error.message
);

}

});


/* ==========================================
   Mark Collected
========================================== */

async function markCollected(id){

if(!confirm(
"Mark this parcel as collected?"
)){

return;

}

try{

await updateDoc(
doc(db,"parcels",id),
{

status:"Collected",

collectedDate:
new Date().toLocaleDateString()

}
);

alert(
"Parcel marked as collected."
);

loadParcels();

}catch(error){

console.error(error);

alert(error.message);

}

}


/* ==========================================
   Search
========================================== */

document.getElementById("searchParcel")
.addEventListener("input",function(){

const keyword=
this.value.toLowerCase();

const filtered=parcels.filter(parcel=>

(parcel.courierCompany||"")
.toLowerCase()
.includes(keyword)

||

(parcel.trackingNumber||"")
.toLowerCase()
.includes(keyword)

||

(parcel.residentName||"")
.toLowerCase()
.includes(keyword)

||

(parcel.flat||"")
.toLowerCase()
.includes(keyword)

);

displayParcels(filtered);

});


/* ==========================================
   Initial Load
========================================== */

loadParcels();


/* ==========================================
   Auto Refresh
========================================== */

setInterval(()=>{

loadParcels();

},30000);

</script>

</body>

</html>
