<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Visitor Approval

</title>

<link rel="stylesheet"
href="../css/style.css">

<link rel="stylesheet"
href="../css/auth.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

table th,
table td{
padding:12px;
border:1px solid #ddd;
text-align:left;
}

button{
margin:2px;
}

.pending{
background:#ff9800;
color:white;
padding:5px 10px;
border-radius:20px;
}

.approved{
background:#4caf50;
color:white;
padding:5px 10px;
border-radius:20px;
}

.rejected{
background:#f44336;
color:white;
padding:5px 10px;
border-radius:20px;
}

</style>

</head>

<body>

<header>

<div class="container">

<h2>

🚶 Visitor Approval

</h2>

<nav>

<a href="dashboard.html">Dashboard</a>

<a href="visitors.html">Visitors</a>

<a href="parcels.html">Parcels</a>

<a href="residents.html">Residents</a>

<a href="emergency.html">Emergency</a>

</nav>

</div>

</header>

<div class="container">

<div class="card">

<h2>

Pending Visitor Requests

</h2>

<table>

<thead>

<tr>

<th>Visitor</th>

<th>Resident</th>

<th>Flat</th>

<th>Arrival</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="visitorTable">

<tr>

<td colspan="6">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

<script type="module">

import { db } from "../firebase/firebase-config.js";

import {

collection,
getDocs,
updateDoc,
doc

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const table=document.getElementById("visitorTable");

async function loadVisitors(){

const snapshot=await getDocs(collection(db,"visitors"));

table.innerHTML="";

if(snapshot.empty){

table.innerHTML="<tr><td colspan='6'>No Visitor Requests</td></tr>";

return;

}

snapshot.forEach((docSnap)=>{

const data=docSnap.data();

let css="pending";

if(data.status==="Approved") css="approved";

if(data.status==="Rejected") css="rejected";

table.innerHTML+=`

<tr>

<td>${data.visitorName}</td>

<td>${data.residentName || "-"}</td>

<td>${data.flat || "-"}</td>

<td>${data.arrivalTime || "-"}</td>

<td>

<span class="${css}">

${data.status}

</span>

</td>

<td>

<button

class="btn primary"

onclick="approveVisitor('${docSnap.id}')">

Approve

</button>

<button

class="btn danger"

onclick="rejectVisitor('${docSnap.id}')">

Reject

</button>

<button

class="btn secondary"

onclick="checkInVisitor('${docSnap.id}')">

Check-In

</button>

<button

class="btn secondary"

onclick="checkOutVisitor('${docSnap.id}')">

Check-Out

</button>

</td>

</tr>

`;

});

}

/* ==========================
   Approve
========================== */

window.approveVisitor=async(id)=>{

await updateDoc(doc(db,"visitors",id),{

status:"Approved",

approvedBy:"Security"

});

loadVisitors();

};

/* ==========================
   Reject
========================== */

window.rejectVisitor=async(id)=>{

await updateDoc(doc(db,"visitors",id),{

status:"Rejected"

});

loadVisitors();

};

/* ==========================
   Check In
========================== */

window.checkInVisitor=async(id)=>{

await updateDoc(doc(db,"visitors",id),{

status:"Checked In",

checkInTime:new Date().toLocaleString()

});

loadVisitors();

};

/* ==========================
   Check Out
========================== */

window.checkOutVisitor=async(id)=>{

await updateDoc(doc(db,"visitors",id),{

status:"Checked Out",

checkOutTime:new Date().toLocaleString()

});

loadVisitors();

};

loadVisitors();

</script>

</body>

</html>
