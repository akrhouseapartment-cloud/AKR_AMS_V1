<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visitor Management</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/auth.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

input,textarea{

width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;

}

table{

width:100%;
border-collapse:collapse;

}

table th,
table td{

padding:12px;
border:1px solid #ddd;
text-align:left;

}

.status{

padding:5px 12px;
border-radius:20px;
color:#fff;
font-size:13px;

}

.pending{

background:#ff9800;

}

.approved{

background:#4caf50;

}

.rejected{

background:#f44336;

}

</style>

</head>

<body>

<header>

<div class="container">

<div class="logo">

<h2>

🚶 Visitor Management

</h2>

<p>

Resident Portal

</p>

</div>

<nav>

<a href="dashboard.html">Dashboard</a>

<a href="visitors.html">Visitors</a>

<a href="payments.html">Payments</a>

<a href="complaints.html">Complaints</a>

<a href="chat.html">Chat</a>

<a href="profile.html">Profile</a>

</nav>

</div>

</header>

<section class="hero">

<div class="container">

<h1>

Visitor Requests

</h1>

<p>

Create visitor requests for Security approval.

</p>

</div>

</section>

<div class="container">

<div class="card">

<h2>

New Visitor

</h2>

<input
type="text"
id="visitorName"
placeholder="Visitor Name">

<input
type="tel"
id="visitorMobile"
placeholder="Mobile Number">

<input
type="text"
id="visitorPurpose"
placeholder="Purpose">

<input
type="datetime-local"
id="arrivalTime">

<button
class="btn primary"
id="saveVisitor">

Submit Request

</button>

</div>

<div class="card">

<h2>

My Visitor Requests

</h2>

<table>

<thead>

<tr>

<th>Name</th>

<th>Purpose</th>

<th>Arrival</th>

<th>Status</th>

</tr>

</thead>

<tbody id="visitorTable">

<tr>

<td colspan="4">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

<script type="module">

import { auth, db } from "../firebase/firebase-config.js";

import {

collection,
addDoc,
query,
where,
getDocs,
serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const table=document.getElementById("visitorTable");

async function loadVisitors(){

const user=auth.currentUser;

if(!user){

table.innerHTML="<tr><td colspan='4'>Please login again.</td></tr>";

return;

}

const q=query(

collection(db,"visitors"),

where("residentUid","==",user.uid)

);

const snapshot=await getDocs(q);

table.innerHTML="";

if(snapshot.empty){

table.innerHTML="<tr><td colspan='4'>No visitor requests found.</td></tr>";

return;

}

snapshot.forEach((doc)=>{

const data=doc.data();

let css="pending";

if(data.status==="Approved") css="approved";

if(data.status==="Rejected") css="rejected";

table.innerHTML+=`

<tr>

<td>${data.visitorName}</td>

<td>${data.purpose}</td>

<td>${data.arrivalTime}</td>

<td>

<span class="status ${css}">

${data.status}

</span>

</td>

</tr>

`;

});

}

document.getElementById("saveVisitor").onclick=async()=>{

const user=auth.currentUser;

if(!user){

alert("Please login again.");

return;

}

const visitorName=document.getElementById("visitorName").value.trim();

const visitorMobile=document.getElementById("visitorMobile").value.trim();

const visitorPurpose=document.getElementById("visitorPurpose").value.trim();

const arrivalTime=document.getElementById("arrivalTime").value;

if(

visitorName===""||

visitorMobile===""||

visitorPurpose===""||

arrivalTime===""

){

alert("Please fill all fields.");

return;

}

await addDoc(collection(db,"visitors"),{

residentUid:user.uid,

residentName:user.displayName||"Resident",

flat:"",

visitorName,

visitorMobile,

purpose:visitorPurpose,

arrivalTime,

status:"Pending",

requestTime:serverTimestamp(),

approvedBy:"",

checkInTime:"",

checkOutTime:"",

remarks:""

});

alert("Visitor request submitted successfully.");

document.getElementById("visitorName").value="";

document.getElementById("visitorMobile").value="";

document.getElementById("visitorPurpose").value="";

document.getElementById("arrivalTime").value="";

loadVisitors();

};

auth.onAuthStateChanged((user)=>{

if(user){

loadVisitors();

}else{

table.innerHTML="<tr><td colspan='4'>Please login.</td></tr>";

}

});

</script>

</body>

</html>
