<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visitors</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="link" href="../css/auth.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

<div class="container">

<div class="logo">

<h2>🚶 Visitor Management</h2>

<p>AKR House Apartments</p>

</div>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="visitors.html">Visitors</a>
<a href="payments.html">Payments</a>
<a href="complaints.html">Complaints</a>
<a href="chat.html">Chat</a>
<a href="profile.html">Profile</a>

</nav>

</div>

</header>

<section class="hero">

<div class="container">

<h1>Visitor Approval</h1>

<p>Approve visitors before they arrive.</p>

</div>

</section>

<section>

<div class="container">

<div class="feature-card">

<h3>Approve New Visitor</h3>

<div class="input-group">

<label>Visitor Name</label>

<input type="text" id="visitorName">

</div>

<div class="input-group">

<label>Mobile Number</label>

<input type="tel" id="visitorMobile">

</div>

<div class="input-group">

<label>Purpose</label>

<input type="text" id="visitorPurpose">

</div>

<div class="input-group">

<label>Expected Time</label>

<input type="datetime-local" id="arrivalTime">

</div>

<button class="btn primary" id="approveBtn">

Approve Visitor

</button>

</div>

<br>

<div class="feature-card">

<h3>Today's Approved Visitors</h3>

<table>

<tr>

<th>Name</th>

<th>Purpose</th>

<th>Status</th>

</tr>

<tbody id="visitorTable">

<tr>

<td colspan="3">

No Visitors

</td>

</tr>

</tbody>

</table>

</div>

</div>

</section>

<footer>

<div class="container footer-content">

<h2>🏠 AKR House Apartments</h2>

<p>Resident Portal</p>

</div>

</footer>

<script>

const table=document.getElementById("visitorTable");

document.getElementById("approveBtn").onclick=function(){

const name=document.getElementById("visitorName").value;

const purpose=document.getElementById("visitorPurpose").value;

if(name===""){

alert("Enter Visitor Name");

return;

}

table.innerHTML+=`

<tr>

<td>${name}</td>

<td>${purpose}</td>

<td style="color:green;">Approved</td>

</tr>

`;

alert("Visitor Approved");

};

</script>

</body>
</html>
