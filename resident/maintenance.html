<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Maintenance Payment

</title>

<link rel="stylesheet"
href="../css/style.css">

<link rel="stylesheet"
href="../css/auth.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
font-size:32px;
color:#1565c0;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

table th,
table td{
padding:12px;
border:1px solid #ddd;
text-align:left;
}

.pending{
background:#ff9800;
color:white;
padding:6px 12px;
border-radius:20px;
}

.paid{
background:#4caf50;
color:white;
padding:6px 12px;
border-radius:20px;
}

</style>

</head>

<body>

<header>

<div class="container">

<h2>

💰 Maintenance Payment

</h2>

<nav>

<a href="dashboard.html">Dashboard</a>

<a href="maintenance.html">Maintenance</a>

<a href="payments.html">Payments</a>

<a href="profile.html">Profile</a>

</nav>

</div>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h2 id="dueAmount">

₹0

</h2>

<p>

Current Due

</p>

</div>

<div class="card">

<h2 id="dueDate">

-

</h2>

<p>

Due Date

</p>

</div>

<div class="card">

<h2 id="paymentStatus">

Pending

</h2>

<p>

Status

</p>

</div>

</div>

<button

class="btn primary"

id="payNow">

💳 Pay Now

</button>

<br><br>

<h2>

Payment History

</h2>

<table>

<thead>

<tr>

<th>Month</th>

<th>Amount</th>

<th>Status</th>

<th>Paid Date</th>

</tr>

</thead>

<tbody id="paymentTable">

<tr>

<td colspan="4">

Loading...

</td>

</tr>

</tbody>

</table>

<script type="module">

import { auth, db }

from "../firebase/firebase-config.js";

import {

collection,
query,
where,
getDocs,
updateDoc,
doc

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const table=document.getElementById("paymentTable");


async function loadMaintenance(){

const user=auth.currentUser;

if(!user){

table.innerHTML="<tr><td colspan='4'>Please login.</td></tr>";

return;

}

const q=query(

collection(db,"maintenance"),

where("residentUid","==",user.uid)

);

const snapshot=await getDocs(q);

table.innerHTML="";

if(snapshot.empty){

table.innerHTML="<tr><td colspan='4'>No Maintenance Records</td></tr>";

return;

}

let latest=null;

snapshot.forEach((docSnap)=>{

const data=docSnap.data();

latest=data;

let css="pending";

if(data.status==="Paid"){

css="paid";

}

table.innerHTML+=`

<tr>

<td>${data.month} ${data.year}</td>

<td>₹${data.amount}</td>

<td>

<span class="${css}">

${data.status}

</span>

</td>

<td>

${data.paidDate || "-"}

</td>

</tr>

`;

});

if(latest){

document.getElementById("dueAmount").innerHTML=

"₹"+latest.amount;

document.getElementById("dueDate").innerHTML=

latest.dueDate;

document.getElementById("paymentStatus").innerHTML=

latest.status;

}

}


/* ==========================================
   Pay Now
========================================== */

document.getElementById("payNow")

.addEventListener("click",async()=>{

const user=auth.currentUser;

if(!user){

alert("Please login.");

return;

}

const q=query(

collection(db,"maintenance"),

where("residentUid","==",user.uid)

);

const snapshot=await getDocs(q);

if(snapshot.empty){

alert("No pending maintenance.");

return;

}

const latest=snapshot.docs[snapshot.docs.length-1];

await updateDoc(

doc(db,"maintenance",latest.id),

{

status:"Paid",

paidDate:new Date().toLocaleDateString(),

paymentMode:"Online",

transactionId:

"TXN"+Date.now()

}

);

alert("Payment recorded successfully.");

loadMaintenance();

});


/* ==========================================
   Download Receipt (CSV)
========================================== */

function downloadReceipt(){

const rows=[];

rows.push([

"Month",
"Amount",
"Status",
"Paid Date"

]);

document

.querySelectorAll("#paymentTable tr")

.forEach(row=>{

const cols=row.querySelectorAll("td");

if(cols.length===4){

rows.push([

cols[0].innerText,

cols[1].innerText,

cols[2].innerText,

cols[3].innerText

]);

}

});

let csv="";

rows.forEach(r=>{

csv+=r.join(",")+"\n";

});

const blob=new Blob([csv],{

type:"text/csv"

});

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download="Maintenance_Receipt.csv";

a.click();

URL.revokeObjectURL(url);

}


/* ==========================================
   Receipt Button
========================================== */

const receiptBtn=document.createElement("button");

receiptBtn.className="btn secondary";

receiptBtn.style.marginLeft="10px";

receiptBtn.innerHTML="📄 Download Receipt";

receiptBtn.onclick=downloadReceipt;

document.getElementById("payNow")

.after(receiptBtn);


/* ==========================================
   Last Updated
========================================== */

const lastUpdated=document.createElement("p");

lastUpdated.id="lastUpdated";

lastUpdated.style.marginTop="20px";

lastUpdated.style.fontWeight="600";

document.querySelector(".container")

.appendChild(lastUpdated);


/* ==========================================
   Refresh
========================================== */

async function refresh(){

await loadMaintenance();

lastUpdated.innerHTML=

"Last Updated : "

+

new Date().toLocaleTimeString();

}

refresh();

setInterval(refresh,30000);


/* ==========================================
   Logout
========================================== */

const logout=document.createElement("button");

logout.className="btn danger";

logout.style.marginLeft="10px";

logout.innerHTML="🚪 Logout";

logout.onclick=()=>{

if(confirm("Logout?")){

window.location.href="../login.html";

}

};

receiptBtn.after(logout);

</script>

</body>

</html>
