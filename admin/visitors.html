<head>

<link rel="stylesheet" href="../css/admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>

<div class="container">

<h2>

📋 Visitor Management

</h2>

<nav>

<div class="container">

<div class="cards">

<div class="card">

<h2 id="totalVisitors">0</h2>

<p>Total Visitors</p>

</div>

<div class="card">

<h2 id="pendingVisitors">0</h2>

<p>Pending</p>

</div>

<div class="card">

<h2 id="approvedVisitors">0</h2>

<p>Approved</p>

</div>

<div class="card">

<h2 id="checkedVisitors">0</h2>

<p>Checked In</p>

</div>

</div>

<div class="search">

<input
type="text"
id="searchBox"
placeholder="Search Visitor / Resident / Flat">

</div>

<table>

<thead>

<tr>

<th>Visitor</th>

<th>Resident</th>

<th>Flat</th>

<th>Arrival</th>

<th>Status</th>

</tr>

</thead>

<tbody id="visitorTable">

<tr>

<td colspan="5">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

<script type="module">

import { db } from "../firebase/firebase-config.js";

import {

collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const table=document.getElementById("visitorTable");

let visitorData=[];


async function loadVisitors(){

const snapshot=await getDocs(collection(db,"visitors"));

visitorData=[];

table.innerHTML="";

let total=0;
let pending=0;
let approved=0;
let checked=0;

snapshot.forEach((docSnap)=>{

const data=docSnap.data();

visitorData.push(data);

total++;

let css="pending";

switch(data.status){

case "Approved":

approved++;
css="approved";
break;

case "Rejected":

css="rejected";
break;

case "Checked In":

checked++;
css="checked";
break;

case "Checked Out":

css="checked";
break;

default:

pending++;
css="pending";

}

table.innerHTML+=`

<tr>

<td>${data.visitorName||"-"}</td>

<td>${data.residentName||"-"}</td>

<td>${data.flat||"-"}</td>

<td>${data.arrivalTime||"-"}</td>

<td>

<span class="status ${css}">

${data.status||"Pending"}

</span>

</td>

</tr>

`;

});

document.getElementById("totalVisitors").innerHTML=total;
document.getElementById("pendingVisitors").innerHTML=pending;
document.getElementById("approvedVisitors").innerHTML=approved;
document.getElementById("checkedVisitors").innerHTML=checked;

if(total===0){

table.innerHTML="<tr><td colspan='5'>No Visitor Records</td></tr>";

}

}

/* ==========================
   Search
========================== */

document.getElementById("searchBox")

.addEventListener("input",function(){

const keyword=this.value.toLowerCase();

const filtered=visitorData.filter(v=>

(v.visitorName||"").toLowerCase().includes(keyword)||

(v.residentName||"").toLowerCase().includes(keyword)||

(v.flat||"").toLowerCase().includes(keyword)

);

table.innerHTML="";

if(filtered.length===0){

table.innerHTML="<tr><td colspan='5'>No Matching Records</td></tr>";

return;

}

filtered.forEach(data=>{

let css="pending";

if(data.status==="Approved") css="approved";
if(data.status==="Rejected") css="rejected";
if(data.status==="Checked In"||data.status==="Checked Out") css="checked";

table.innerHTML+=`

<tr>

<td>${data.visitorName}</td>

<td>${data.residentName}</td>

<td>${data.flat}</td>

<td>${data.arrivalTime}</td>

<td>

<span class="status ${css}">

${data.status}

</span>

</td>

</tr>

`;

});

});




                                        





  /* ==========================
   Export Visitors to CSV
========================== */

function exportVisitors(){

if(visitorData.length===0){

alert("No visitor data available to export.");

return;

}

const rows=[

[
"Visitor Name",
"Resident Name",
"Flat",
"Mobile",
"Purpose",
"Arrival Time",
"Status"
]

];

visitorData.forEach(v=>{

rows.push([

v.visitorName || "",
v.residentName || "",
v.flat || "",
v.visitorMobile || "",
v.purpose || "",
v.arrivalTime || "",
v.status || "Pending"

]);

});

const csv=rows.map(row=>

row.map(value=>

`"${String(value).replace(/"/g,'""')}"`

).join(",")

).join("\n");

const blob=new Blob(

[csv],

{type:"text/csv;charset=utf-8;"}

);

const url=URL.createObjectURL(blob);

const link=document.createElement("a");

const today=new Date();

const date=

today.getFullYear()+"-"+

String(today.getMonth()+1).padStart(2,"0")+"-"+

String(today.getDate()).padStart(2,"0");

link.href=url;

link.download=`AKR_Visitor_Report_${date}.csv`;

document.body.appendChild(link);

link.click();

document.body.removeChild(link);

URL.revokeObjectURL(url);

}


/* ==========================
   Create Export Button
========================== */

const exportButton=document.createElement("button");

exportButton.className="btn primary";

exportButton.innerHTML="📥 Export CSV";

exportButton.style.marginTop="20px";
exportButton.style.marginRight="10px";

exportButton.addEventListener("click",exportVisitors);

document.querySelector(".container table")
.parentElement.appendChild(exportButton);
