<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Notice Management

</title>

<link rel="stylesheet"
href="../css/style.css">

<link rel="stylesheet"
href="../css/admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

.container{
max-width:1300px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

input,
select,
textarea{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;

}

.notice-card{

background:#fafafa;
padding:15px;
border-left:5px solid #1565c0;
margin-top:15px;
border-radius:8px;

}

.high{
border-left-color:#d32f2f;
}

.medium{
border-left-color:#ff9800;
}

.low{
border-left-color:#4caf50;
}

</style>

</head>

<body>

<header>

<div class="container">

<h2>

📢 Notice Management

</h2>

<nav>

<a href="Dashboard.html">

Dashboard

</a>

<a href="notices.html">

Notices

</a>

<a href="maintenance.html">

Maintenance

</a>

<a href="complaints.html">

Complaints

</a>

</nav>

</div>

</header>

<div class="container">

<div class="card">

<h2>

Create Notice

</h2>

<input

type="text"

id="title"

placeholder="Notice Title">

<select id="category">

<option>

Maintenance

</option>

<option>

Emergency

</option>

<option>

General

</option>

<option>

Events

</option>

</select>

<select id="priority">

<option>

High

</option>

<option>

Medium

</option>

<option>

Low

</option>

</select>

<input

type="date"

id="expiry">

<textarea

id="description"

rows="6"

placeholder="Notice Description">

</textarea>

<button

class="btn primary"

id="publishNotice">

Publish Notice

</button>

</div>

<div class="card">

<h2>

Published Notices

</h2>

<div id="noticeList">

Loading...

</div>

</div>

<script type="module">

import { db }

from "../firebase/firebase-config.js";

import {

collection,
addDoc,
getDocs,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const noticeList=document.getElementById("noticeList");


async function loadNotices(){

const snapshot=await getDocs(collection(db,"notices"));

noticeList.innerHTML="";

if(snapshot.empty){

noticeList.innerHTML="<p>No notices published.</p>";

return;

}

snapshot.forEach((docSnap)=>{

const data=docSnap.data();

const priority=(data.priority||"Low").toLowerCase();

noticeList.innerHTML+=`

<div class="notice-card ${priority}">

<h3>${data.title}</h3>

<p><b>Category :</b> ${data.category}</p>

<p><b>Priority :</b> ${data.priority}</p>

<p><b>Posted :</b> ${data.postedDate}</p>

<p><b>Expiry :</b> ${data.expiryDate}</p>

<p>${data.description}</p>

<button

class="btn danger"

onclick="deleteNotice('${docSnap.id}')">

🗑 Delete

</button>

</div>

`;

});

}


/* ==========================================
   Publish Notice
========================================== */

document.getElementById("publishNotice")

.addEventListener("click",async()=>{

const title=document.getElementById("title").value.trim();

const category=document.getElementById("category").value;

const priority=document.getElementById("priority").value;

const expiry=document.getElementById("expiry").value;

const description=document.getElementById("description").value.trim();

if(

title===""||

description===""||

expiry===""

){

alert("Please fill all fields.");

return;

}

await addDoc(collection(db,"notices"),{

title,

category,

priority,

description,

postedBy:"Admin",

postedDate:new Date().toLocaleDateString(),

expiryDate:expiry,

status:"Active",

createdAt:serverTimestamp()

});

alert("Notice Published Successfully.");

document.getElementById("title").value="";

document.getElementById("description").value="";

document.getElementById("expiry").value="";

loadNotices();

});


/* ==========================================
   Delete Notice
========================================== */

import {
deleteDoc,
updateDoc,
doc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

window.deleteNotice = async(id)=>{

if(!confirm("Delete this notice?")) return;

try{

await deleteDoc(doc(db,"notices",id));

alert("Notice deleted successfully.");

loadNotices();

}catch(error){

console.error(error);

alert(error.message);

}

};


/* ==========================================
   Edit Notice
========================================== */

window.editNotice = async(id)=>{

const title=prompt("Enter New Title");

if(!title) return;

const description=prompt("Enter New Description");

if(!description) return;

try{

await updateDoc(doc(db,"notices",id),{

title:title,

description:description

});

alert("Notice updated successfully.");

loadNotices();

}catch(error){

console.error(error);

alert(error.message);

}

};


/* ==========================================
   Search Notice
========================================== */

const search=document.createElement("input");

search.type="text";

search.placeholder="Search Notices";

search.style.marginBottom="20px";

document.querySelector("#noticeList")
.parentElement.insertBefore(

search,

document.getElementById("noticeList")

);

search.addEventListener("input",()=>{

const keyword=search.value.toLowerCase();

const cards=document.querySelectorAll(".notice-card");

cards.forEach(card=>{

const text=card.innerText.toLowerCase();

card.style.display=text.includes(keyword)

? "block"

: "none";

});

});


/* ==========================================
   Filter Category
========================================== */

const filter=document.createElement("select");

filter.innerHTML=`

<option value="All">

All Categories

</option>

<option value="Maintenance">

Maintenance

</option>

<option value="Emergency">

Emergency

</option>

<option value="General">

General

</option>

<option value="Events">

Events

</option>

`;

filter.style.marginBottom="20px";

document.querySelector("#noticeList")
.parentElement.insertBefore(

filter,

document.getElementById("noticeList")

);

filter.addEventListener("change",()=>{

const value=filter.value.toLowerCase();

const cards=document.querySelectorAll(".notice-card");

cards.forEach(card=>{

if(value==="all"){

card.style.display="block";

}else{

card.style.display=

card.innerText.toLowerCase().includes(value)

? "block"

: "none";

}

});

});


/* ==========================================
   Export Notices to CSV
========================================== */

function exportCSV(){

let csv="Title,Category,Priority,Posted Date,Expiry Date,Status\n";

document.querySelectorAll(".notice-card").forEach(card=>{

const lines=card.innerText.split("\n");

const title=lines[0]||"";
const category=(lines[1]||"").replace("Category : ","");
const priority=(lines[2]||"").replace("Priority : ","");
const posted=(lines[3]||"").replace("Posted : ","");
const expiry=(lines[4]||"").replace("Expiry : ","");

csv+=`"${title}","${category}","${priority}","${posted}","${expiry}","Active"\n`;

});

const blob=new Blob([csv],{

type:"text/csv"

});

const url=URL.createObjectURL(blob);

const link=document.createElement("a");

link.href=url;

link.download="AKR_Notices_Report.csv";

link.click();

URL.revokeObjectURL(url);

}


/* ==========================================
   Export Button
========================================== */

const exportBtn=document.createElement("button");

exportBtn.className="btn secondary";

exportBtn.innerHTML="📥 Export CSV";

exportBtn.style.marginLeft="10px";

exportBtn.onclick=exportCSV;

document.getElementById("publishNotice")

.after(exportBtn);


/* ==========================================
   Last Updated
========================================== */

const lastUpdated=document.createElement("p");

lastUpdated.id="lastUpdated";

lastUpdated.style.marginTop="20px";

lastUpdated.style.fontWeight="600";

document.querySelector(".container")

.appendChild(lastUpdated);


/* ==========================================
   Logout Button
========================================== */

const logoutBtn=document.createElement("button");

logoutBtn.className="btn danger";

logoutBtn.style.marginLeft="10px";

logoutBtn.innerHTML="🚪 Logout";

logoutBtn.onclick=function(){

if(confirm("Logout from AKR AMS?")){

window.location.href="../login.html";

}

};

exportBtn.after(logoutBtn);


/* ==========================================
   Refresh
========================================== */

async function refresh(){

await loadNotices();

lastUpdated.innerHTML=

"Last Updated : "+new Date().toLocaleTimeString();

}

refresh();

setInterval(refresh,30000);


/* ==========================================
   Console
========================================== */

window.addEventListener("load",()=>{

console.log("================================");

console.log("AKR AMS");

console.log("Admin Notice Module");

console.log("Firebase Connected");

console.log("Version : 1.0.0");

console.log("================================");

});

</script>

</body>

</html>
