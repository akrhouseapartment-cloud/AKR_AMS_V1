<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Maintenance Management

</title>

<link rel="stylesheet"
href="../css/style.css">

<link rel="stylesheet"
href="../css/admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

.container{
max-width:1300px;
margin:auto;
padding:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
font-size:34px;
margin:0;
color:#1565c0;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

table th,
table td{
padding:12px;
border:1px solid #ddd;
text-align:left;
}

.pending{

background:#ff9800;
color:white;
padding:6px 12px;
border-radius:20px;

}

.paid{

background:#4caf50;
color:white;
padding:6px 12px;
border-radius:20px;

}

</style>

</head>

<body>

<header>

<div class="container">

<h2>

💰 Maintenance Management

</h2>

<nav>

<a href="Dashboard.html">

Dashboard

</a>

<a href="maintenance.html">

Maintenance

</a>

<a href="complaints.html">

Complaints

</a>

<a href="visitors.html">

Visitors

</a>

</nav>

</div>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h2 id="totalResidents">

0

</h2>

<p>

Residents

</p>

</div>

<div class="card">

<h2 id="pendingPayments">

₹0

</h2>

<p>

Pending Collection

</p>

</div>

<div class="card">

<h2 id="receivedPayments">

₹0

</h2>

<p>

Collected

</p>

</div>

<div class="card">

<h2 id="totalAmount">

₹0

</h2>

<p>

Total Amount

</p>

</div>

</div>

<button

class="btn primary"

id="generateMaintenance">

Generate Monthly Maintenance

</button>

<br><br>

<table>

<thead>

<tr>

<th>Resident</th>

<th>Flat</th>

<th>Month</th>

<th>Amount</th>

<th>Status</th>

</tr>

</thead>

<tbody id="maintenanceTable">

<tr>

<td colspan="5">

Loading...

</td>

</tr>

</tbody>

</table>

<script type="module">

import { db }

from "../firebase/firebase-config.js";

import {

collection,
getDocs,
addDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const table=document.getElementById("maintenanceTable");

let maintenance=[];

let residents=[];


async function loadData(){

table.innerHTML="";

maintenance=[];

residents=[];

const residentSnapshot=await getDocs(collection(db,"residents"));

residentSnapshot.forEach((doc)=>{

const data=doc.data();

if(data.role==="resident" && data.status==="Approved"){

residents.push(data);

}

});

const maintenanceSnapshot=await getDocs(collection(db,"maintenance"));

let pendingAmount=0;

let paidAmount=0;

let totalAmount=0;

maintenanceSnapshot.forEach((doc)=>{

const data=doc.data();

maintenance.push({

id:doc.id,

...data

});

totalAmount+=Number(data.amount||0);

if(data.status==="Paid"){

paidAmount+=Number(data.amount||0);

}else{

pendingAmount+=Number(data.amount||0);

}

table.innerHTML+=`

<tr>

<td>${data.residentName||"-"}</td>

<td>${data.flat||"-"}</td>

<td>${data.month||"-"} ${data.year||""}</td>

<td>₹${data.amount||0}</td>

<td>

<span class="${data.status==="Paid"?"paid":"pending"}">

${data.status||"Pending"}

</span>

</td>

</tr>

`;

});

if(maintenance.length===0){

table.innerHTML=`

<tr>

<td colspan="5">

No Maintenance Generated

</td>

</tr>

`;

}

document.getElementById("totalResidents").innerHTML=residents.length;

document.getElementById("pendingPayments").innerHTML="₹"+pendingAmount;

document.getElementById("receivedPayments").innerHTML="₹"+paidAmount;

document.getElementById("totalAmount").innerHTML="₹"+totalAmount;

}


/* ==========================================
   Generate Monthly Maintenance
========================================== */

document.getElementById("generateMaintenance")

.addEventListener("click",async()=>{

const month=new Date().toLocaleString("default",{

month:"long"

});

const year=new Date().getFullYear();

for(const resident of residents){

await addDoc(collection(db,"maintenance"),{

residentUid:resident.uid||"",

residentName:resident.name||"",

flat:resident.flat||"",

month,

year,

amount:1500,

dueDate:`10-${month}-${year}`,

paidDate:"",

status:"Pending",

paymentMode:"",

transactionId:"",

remarks:"",

createdAt:serverTimestamp()

});

}

alert("Monthly Maintenance Generated Successfully.");

loadData();

});



/* ==========================================
   Search Maintenance
========================================== */

const searchBox=document.createElement("input");

searchBox.type="text";

searchBox.placeholder="Search Resident / Flat / Month";

searchBox.style.width="100%";

searchBox.style.padding="12px";

searchBox.style.margin="20px 0";

document.querySelector(".container")

.insertBefore(

searchBox,

document.querySelector("table")

);

searchBox.addEventListener("input",()=>{

const keyword=searchBox.value.toLowerCase();

table.innerHTML="";

const filtered=maintenance.filter(item=>

(item.residentName||"").toLowerCase().includes(keyword)||

(item.flat||"").toLowerCase().includes(keyword)||

(item.month||"").toLowerCase().includes(keyword)

);

if(filtered.length===0){

table.innerHTML=`

<tr>

<td colspan="5">

No matching records found.

</td>

</tr>

`;

return;

}

filtered.forEach(data=>{

table.innerHTML+=`

<tr>

<td>${data.residentName||"-"}</td>

<td>${data.flat||"-"}</td>

<td>${data.month||"-"} ${data.year||""}</td>

<td>₹${data.amount||0}</td>

<td>

<span class="${data.status==="Paid"?"paid":"pending"}">

${data.status}

</span>

</td>

</tr>

`;

});

});


/* ==========================================
   Export CSV
========================================== */

function exportCSV(){

if(maintenance.length===0){

alert("No maintenance records available.");

return;

}

let csv="Resident,Flat,Month,Amount,Status\n";

maintenance.forEach(item=>{

csv+=`"${item.residentName||""}","${item.flat||""}","${item.month||""} ${item.year||""}","${item.amount||0}","${item.status||""}"\n`;

});

const blob=new Blob([csv],{

type:"text/csv"

});

const url=URL.createObjectURL(blob);

const link=document.createElement("a");

link.href=url;

link.download="AKR_Maintenance_Report.csv";

link.click();

URL.revokeObjectURL(url);

}

const exportBtn=document.createElement("button");

exportBtn.className="btn secondary";

exportBtn.style.marginLeft="10px";

exportBtn.innerHTML="📥 Export CSV";

exportBtn.onclick=exportCSV;

document

.getElementById("generateMaintenance")

.after(exportBtn);


/* ==========================================
   Collection Analytics
========================================== */

const analytics=document.createElement("div");

analytics.className="card";

analytics.style.marginTop="20px";

analytics.id="analyticsCard";

analytics.innerHTML=`

<h3>📊 Collection Analytics</h3>

<p id="analyticsText">

Loading...

</p>

`;

document.querySelector(".container")

.appendChild(analytics);

function updateAnalytics(){

const paid=maintenance.filter(x=>x.status==="Paid").length;

const pending=maintenance.filter(x=>x.status!=="Paid").length;

document.getElementById("analyticsText").innerHTML=

`Paid Records : <b>${paid}</b><br>

Pending Records : <b>${pending}</b><br>

Total Records : <b>${maintenance.length}</b>`;

  }


/* ==========================================
   Last Updated
========================================== */

const lastUpdated=document.createElement("p");

lastUpdated.id="lastUpdated";

lastUpdated.style.marginTop="20px";

lastUpdated.style.fontWeight="600";

document.querySelector(".container").appendChild(lastUpdated);


/* ==========================================
   Logout Button
========================================== */

const logoutBtn=document.createElement("button");

logoutBtn.className="btn danger";

logoutBtn.style.marginLeft="10px";

logoutBtn.innerHTML="🚪 Logout";

logoutBtn.onclick=function(){

if(confirm("Are you sure you want to logout?")){

window.location.href="../login.html";

}

};

exportBtn.after(logoutBtn);


/* ==========================================
   Refresh Dashboard
========================================== */

async function refreshDashboard(){

try{

await loadData();

updateAnalytics();

lastUpdated.innerHTML=

"Last Updated : "+new Date().toLocaleTimeString();

}catch(error){

console.error(error);

table.innerHTML=`

<tr>

<td colspan="5">

Unable to load maintenance records.

</td>

</tr>

`;

}

}


/* ==========================================
   Auto Refresh
========================================== */

refreshDashboard();

setInterval(refreshDashboard,30000);


/* ==========================================
   Console Log
========================================== */

window.addEventListener("load",()=>{

console.log("================================");

console.log("AKR AMS");

console.log("Admin Maintenance Dashboard");

console.log("Firebase Connected");

console.log("Version : 1.0.0");

console.log("================================");

});

</script>

</body>

</html>
