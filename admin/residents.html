<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Residents - AKR House Apartments</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="link" href="../css/admin.css">

<style>

body{
font-family:Poppins,sans-serif;
background:#f5f7fb;
margin:0;
}

header{
background:#16355d;
color:#fff;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:20px;
}

input{
width:100%;
padding:12px;
margin-bottom:20px;
border-radius:8px;
border:1px solid #ccc;
}

.card{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card h3{
margin:0 0 10px;
}

button{
padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
margin:5px;
}

.primary{
background:#0d6efd;
color:#fff;
}

.danger{
background:#dc3545;
color:#fff;
}

</style>

</head>

<body>

<header>

<h2>🏠 Residents</h2>

<button class="primary"
onclick="location.href='Dashboard.html'">

Dashboard

</button>

</header>

<div class="container">

<input
type="text"
id="search"
placeholder="Search Name / Flat / Mobile">

<div id="residentList">

Loading...

</div>

</div>

<script type="module">

import {db} from "../firebase/firebase-config.js";

import{

collection,
getDocs

}from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const container=document.getElementById("residentList");

const search=document.getElementById("search");

let residents=[];

async function loadResidents(){

container.innerHTML="Loading...";

const snapshot=await getDocs(collection(db,"users"));

residents=[];

snapshot.forEach(doc=>{

const data=doc.data();

if(data.role==="resident" && data.status==="Approved"){

residents.push(data);

}

});

showResidents(residents);

}

function showResidents(list){

container.innerHTML="";

if(list.length==0){

container.innerHTML="<h3>No Residents Found</h3>";

return;

}

list.forEach(r=>{

container.innerHTML+=`

<div class="card">

<h3>${r.name}</h3>

<p><b>Email:</b> ${r.email}</p>

<p><b>Mobile:</b> ${r.mobile}</p>

<p><b>Flat:</b> ${r.flat}</p>

<p><b>Floor:</b> ${r.floor}</p>

<p><b>Vehicle:</b> ${r.vehicle}</p>

<p><b>Status:</b> ${r.status}</p>

</div>

`;

});

}

search.addEventListener("input",()=>{

const value=search.value.toLowerCase();

const filtered=residents.filter(r=>

(r.name||"").toLowerCase().includes(value)||

(r.flat||"").toLowerCase().includes(value)||

(r.mobile||"").toLowerCase().includes(value)

);

showResidents(filtered);

});

loadResidents();

</script>

</body>
</html>
