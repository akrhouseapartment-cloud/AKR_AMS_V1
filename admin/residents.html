<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Residents</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
font-family:Poppins,Arial,sans-serif;
background:#f5f7fa;
margin:0;
}

header{
background:#17375e;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:15px;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:20px;
font-size:16px;
box-sizing:border-box;
}

.card{

background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);

}

.card h3{

margin:0 0 10px;

}

.card p{

margin:6px 0;

}

.btn{

padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;

}

.primary{

background:#1565c0;
color:white;

}

.success{

background:#2e7d32;
color:white;

}

</style>

</head>

<body>

<header>

<h2>🏠 Residents</h2>

<button
class="btn primary"
onclick="location.href='Dashboard.html'">

Dashboard

</button>

</header>

<div class="container">

<input
type="text"
id="search"
placeholder="Search Name / Flat / Mobile">

<div id="residentList">

Loading...

</div>

</div>

<script type="module">

import {db} from "../firebase/firebase-config.js";

import {

collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const residentList=document.getElementById("residentList");

const search=document.getElementById("search");

let residents=[];

async function loadResidents(){

residentList.innerHTML="Loading...";

residents=[];

const snapshot=await getDocs(collection(db,"residents"));

snapshot.forEach((doc)=>{

const data=doc.data();

if(data.status==="Approved"){

residents.push(data);

}

});

displayResidents(residents);

}

function displayResidents(list){

residentList.innerHTML="";

if(list.length===0){

residentList.innerHTML="<h2>No Residents Found</h2>";

return;

}

list.forEach((r)=>{

residentList.innerHTML+=`

<div class="card">

<h3>${r.name || "-"}</h3>

<p><b>Email:</b> ${r.email || "-"}</p>

<p><b>Mobile:</b> ${r.mobile || "-"}</p>

<p><b>Flat:</b> ${r.flat || "-"}</p>

<p><b>Floor:</b> ${r.floor || "-"}</p>

<p><b>Vehicle:</b> ${r.vehicle || "-"}</p>

<p><b>Role:</b> ${r.role || "-"}</p>

<p><b>Status:</b> ${r.status || "-"}</p>

</div>

`;

});

}

search.addEventListener("input",()=>{

const value=search.value.toLowerCase();

const filtered=residents.filter((r)=>{

return(

(r.name||"").toLowerCase().includes(value)||

(r.mobile||"").toLowerCase().includes(value)||

(r.flat||"").toLowerCase().includes(value)||

(r.email||"").toLowerCase().includes(value)

);

});

displayResidents(filtered);

});

loadResidents();

</script>

</body>
</html>
