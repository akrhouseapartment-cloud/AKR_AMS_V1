<!DOCTYPE html>

<script type="module">

import { db } from "../firebase/firebase-config.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const residentList = document.getElementById("residentList");
const search = document.getElementById("search");

let residents = [];

async function loadResidents(){

residentList.innerHTML="Loading...";

residents=[];

try{

const snapshot = await getDocs(collection(db,"residents"));

snapshot.forEach((doc)=>{

const data = doc.data();

/* Show only Approved Residents */

if(

data.status==="Approved" &&
data.role==="resident"

){

residents.push(data);

}

});

displayResidents(residents);

}catch(error){

console.error(error);

residentList.innerHTML="<h3>Error loading residents.</h3>";

}

}

function displayResidents(list){

residentList.innerHTML="";

if(list.length===0){

residentList.innerHTML="<h2>No Residents Found</h2>";

return;

}

list.forEach((r)=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<h3>${r.name || "-"}</h3>

<p><b>Email:</b> ${r.email || "-"}</p>

<p><b>Mobile:</b> ${r.mobile || "-"}</p>

<p><b>Flat:</b> ${r.flat || "-"}</p>

<p><b>Floor:</b> ${r.floor || "-"}</p>

<p><b>Vehicle:</b> ${r.vehicle || "-"}</p>

<p><b>Status:</b> ${r.status || "-"}</p>

`;

residentList.appendChild(card);

});

}

search.addEventListener("input",()=>{

const keyword=search.value.toLowerCase();

const filtered=residents.filter((r)=>{

return(

(r.name || "").toLowerCase().includes(keyword) ||

(r.email || "").toLowerCase().includes(keyword) ||

(r.mobile || "").toLowerCase().includes(keyword) ||

(r.flat || "").toLowerCase().includes(keyword)

);

});

displayResidents(filtered);

});

loadResidents();

</script>
